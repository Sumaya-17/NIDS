services:
  - type: web
    name: nids
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir Flask_App app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nids-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: nids-db
    plan: free