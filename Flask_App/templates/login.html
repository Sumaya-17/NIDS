<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Aegis5G Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nids-ui.css') }}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="row g-0">
        <div class="col-lg-5">
          <div class="auth-side d-flex flex-column justify-content-between p-4 p-md-5">
            <a class="d-flex align-items-center gap-3" href="{{ url_for('index') }}">
              <span class="brand-mark">A5</span>
              <span class="brand-copy">
                <strong>Aegis5G</strong>
                <span>Secure access</span>
              </span>
            </a>
            <div>
              <p class="eyebrow fw-bold mb-2">SOC console access</p>
              <h1 class="display-6 fw-bold">Welcome back.</h1>
              <p class="mb-0 text-muted-soft">Authenticate to access AI prediction, live monitoring, and threat analytics.</p>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="p-4 p-md-5">
            <p class="eyebrow fw-bold mb-2">Identity verification</p>
            <h2 class="h3 fw-bold mb-2">Login to Aegis5G</h2>
            <p class="text-muted-soft mb-4">Use your registered username and password.</p>
            <form class="auth-form" action="/login" method="POST">
              <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter username" required>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Enter password" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100">Authenticate</button>
            </form>
            <p class="mt-4 mb-0 text-muted-soft">New user? <a class="fw-bold text-decoration-underline" href="{{ url_for('register') }}">Create an account</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="{{ url_for('static', filename='jquery/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='bootstrap/bootstrap.min.js') }}"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{{ url_for('static', filename='js/nids-ui.js') }}"></script>
  <script>
    {% if message %}
    Swal.fire({ icon: "error", title: "Incorrect Details" });
    {% endif %}
  </script>
</body>
</html>
