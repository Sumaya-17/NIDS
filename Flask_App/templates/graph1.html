{% extends 'base_tem.html' %}

{% block page_title %}Attack Distribution{% endblock page_title %}

{% block content %}
<div class="mb-4">
  <p class="eyebrow fw-bold mb-2">Threat analytics</p>
  <h2 class="h4 fw-bold mb-2">Attack distribution overview</h2>
  <p class="text-muted-soft mb-0">Bar chart generated by the existing Flask Plotly route.</p>
</div>
<div class="plot-frame" id="plot"></div>
{% endblock content %}

{% block scripts %}
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
  var plotData = {{ plot_json | safe }};
  plotData.layout.paper_bgcolor = 'rgba(15, 23, 42, 0)';
  plotData.layout.plot_bgcolor = 'rgba(15, 23, 42, 0)';
  plotData.layout.font = { color: '#F8FAFC' };
  Plotly.newPlot('plot', plotData.data, plotData.layout, { responsive: true, displayModeBar: false });
</script>
{% endblock scripts %}
